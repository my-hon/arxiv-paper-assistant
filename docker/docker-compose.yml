version: '3.8'

services:
  # PostgreSQL数据库服务
  postgres:
    image: postgres:15-alpine
    container_name: ai-paper-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-paper_system}
      - POSTGRES_USER=${POSTGRES_USER:-paper_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paper_user -d paper_system"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Chroma向量数据库服务
  chroma:
    image: chromadb/chroma:latest
    container_name: ai-paper-chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3

  # 主应用服务
  paper-system:
    build: .
    container_name: ai-paper-system
    ports:
      - "8000:8000"
    volumes:
      - ./storage:/app/storage
      - ./logs:/app/logs
      - /var/run/docker.sock:/var/run/docker.sock  # 挂载Docker套接字用于沙箱执行
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=${DEBUG:-False}
      - API_KEY=${API_KEY:?API_KEY is required}
      - OPENAI_API_KEY=${OPENAI_API_KEY:?OPENAI_API_KEY is required}
      - OPENAI_BASE_URL=${OPENAI_BASE_URL:-https://api.openai.com/v1}
      - MODEL_NAME=${MODEL_NAME:-gpt-3.5-turbo-1106}
      - DATABASE_URL=postgresql://${POSTGRES_USER:-paper_user}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}@postgres:5432/${POSTGRES_DB:-paper_system}
      - CHROMA_DB_HOST=chroma
      - CHROMA_DB_PORT=8000
      - STORAGE_PATH=./storage
      - DOCKER_SOCKET=unix:///var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      chroma:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  chroma_data:
