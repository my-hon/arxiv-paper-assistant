version: '3.8'

services:
  # PostgreSQL数据库服务
  postgres:
    image: postgres:15-alpine
    container_name: ai-paper-postgres
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-paper_system}
      - POSTGRES_USER=${POSTGRES_USER:-paper_user}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U paper_user -d paper_system"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Chroma向量数据库服务
  chroma:
    image: chromadb/chroma:latest
    container_name: ai-paper-chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/heartbeat"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
  chroma_data:
